name: Build, Push and Deploy Backend Ev2F

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: revisar codigo
        uses: actions/checkout@v4

      - name: log docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: compilar y subir imagen docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tienda-backendev2f:latest

deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Desplegar en el Backend usando el Frontend como Puente (Bastión)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            ssh -o StrictHostKeyChecking=no ec2-user@10.0.140.120 << 'EOF'
              sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tienda-backendev2f:latest
              sudo docker stop competent_herschel || true
              sudo docker rm competent_herschel || true
              sudo docker run -d -p 3001:3001 --name competent_herschel --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/tienda-backendev2f:latest
            EOF